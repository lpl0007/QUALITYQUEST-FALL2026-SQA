
name: SQA Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml ruamel.yaml pandas

      - name: Run fuzz testing
        run: |
          python fuzz.py > fuzz-results.log 2>&1
          cat fuzz-results.log

      - name: Upload fuzzing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-results
          path: fuzz-results.log
